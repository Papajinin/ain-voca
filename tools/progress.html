<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIN Voca 진도 보기</title>
  <style>
    body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; background: #F2F2F7; color: #1C1C1E; max-width: 480px; margin: 0 auto; padding: 24px 16px; line-height: 1.6; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    button { font: inherit; font-weight: 800; border-radius: 10px; padding: 10px 16px; border: 1.5px solid #8DB8F0; background: #E5EFFC; color: #0B2A55; cursor: pointer; }
    .nav { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 12px; }
    .nav b { font-size: 18px; }
    .nav button { padding: 6px 14px; }
    .nav button:disabled { opacity: .3; }
    .card { background: #fff; border: 1.5px solid #E0E0E6; border-radius: 12px; padding: 14px 16px; margin-top: 10px; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
    .row span:first-child { color: #5B5B66; }
    .row span:last-child { font-weight: 800; text-align: right; }
    .sub { font-size: 14px; color: #5B5B66; padding-left: 12px; }
    .empty { color: #5B5B66; text-align: center; padding: 12px 0; }
    select { font: inherit; padding: 6px; border-radius: 8px; }
    #msg { margin-top: 16px; color: #5B5B66; font-size: 14px; }
  </style>
</head>
<body>
  <!-- 아빠 전용: 아인이가 그날 한 진도 보기 (읽기만). 앱 주소 뒤에 /tools/progress.html -->
  <h1>AIN Voca · 진도 보기</h1>
  <button id="login" type="button">구글로 로그인</button>
  <div id="main" hidden>
    <div id="who"></div>
    <div class="nav">
      <button id="prev" type="button">‹</button>
      <b id="date"></b>
      <button id="next" type="button">›</button>
    </div>
    <div id="day"></div>
    <div id="total"></div>
  </div>
  <div id="msg"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    // 앱의 sync.js와 같은 값 (공개돼도 괜찮은 값. 누가 읽을지는 Firestore 규칙이 막음)
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyB__KSCE69_SJVvMuQJyw2Tq29xVXKP_XA",
      authDomain: "ain-word.firebaseapp.com",
      projectId: "ain-word",
      storageBucket: "ain-word.firebasestorage.app",
      messagingSenderId: "188536319141",
      appId: "1:188536319141:web:46ec7cae27d036a618f14c"
    };
  </script>
  <script>
    const $ = id => document.getElementById(id);
    const msg = t => { $('msg').textContent = t; };
    const pad = n => String(n).padStart(2, '0');
    const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const WD = '일월화수목금토';
    const row = (a, b) => `<div class="row"><span>${a}</span><span>${b}</span></div>`;
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    let people = [], cur = 0, day = new Date();

    const GROUP = { noun: '명사', verb: '동사', adj: '형용사', adv: '부사', func: '기능어' };
    const MODE = { 'en-ko': '영→한', 'ko-en': '한→영' };
    const md = k => { const [, m, d] = k.split('-'); return `${Number(m)}/${Number(d)}`; };
    // "en-ko_A1_noun_10_5" → "A1 명사 Stage 5 (영→한)"
    function stageName(key) {
      const [mode, level, group, , day] = key.split('_');
      return `${level} ${GROUP[group] || group} Stage ${day} (${MODE[mode] || mode})`;
    }

    function render() {
      const p = people[cur];
      const k = keyOf(day);
      $('date').textContent = `${day.getMonth() + 1}월 ${day.getDate()}일 (${WD[day.getDay()]})`;
      $('next').disabled = k >= keyOf(new Date());
      const logs = p.state.dailyLog;
      const d = logs && logs[k];
      if (!logs) {
        $('day').innerHTML = '<div class="card empty">아직 날짜별 기록이 없어요.<br>앱이 새 버전(11)을 받은 날부터 쌓여요.</div>';
      } else if (!d) {
        $('day').innerHTML = '<div class="card empty">이날은 기록이 없어요.</div>';
      } else {
        const st = d.st || [], ch = d.ch || [];
        const mk = k.slice(0, 7);
        const opened = ((p.state.challenge || {}).tiles || {})[mk] || [];
        const chText = !ch.length ? '-' : ch.length === 1 && ch[0] === k ? '✓ 채움' : `✓ ${ch.map(md).join(', ')} 칸 채움`;
        $('day').innerHTML = `<div class="card">
          ${row('클리어한 Stage', `${st.length}개`)}
          ${st.map(x => `<div class="row sub"><span>${esc(stageName(x))}</span><span></span></div>`).join('')}
          ${row('오답노트에 넣은 단어', `${d.nb || 0}개`)}
          ${row('데일리 챌린지', chText)}
          ${row('퍼즐 조각', d.tl ? `+${d.tl} (${Number(mk.slice(5))}월 ${opened.length}/35)` : '-')}
        </div>`;
      }
      const s = p.summary;
      const last = p.updatedAt ? new Date(p.updatedAt) : null;
      $('total').innerHTML = `<div class="card">
        ${s ? row('전체 클리어 Stage', `${s.cleared}개`) : ''}
        ${row('마지막으로 저장', last ? `${last.getMonth() + 1}/${last.getDate()} ${pad(last.getHours())}:${pad(last.getMinutes())}` : '-')}
      </div>`;
    }

    if (!FIREBASE_CONFIG.apiKey) msg('Firebase가 연결되지 않았어요 (sync-config.js).');
    else {
      firebase.initializeApp(FIREBASE_CONFIG);
      const auth = firebase.auth(), db = firebase.firestore();
      db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); // Safari에서 연결이 멈추는 것 막기
      $('login').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
        .catch(() => auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()));
      $('prev').onclick = () => { day.setDate(day.getDate() - 1); render(); };
      $('next').onclick = () => { day.setDate(day.getDate() + 1); render(); };
      auth.onAuthStateChanged(async u => {
        if (!u) return;
        $('login').hidden = true;
        msg('불러오는 중…');
        try {
          const snap = await db.collection('users').get();
          people = [];
          snap.forEach(doc => {
            if (doc.id === u.uid) return; // 아빠 자기 기록은 빼고
            const d = doc.data();
            people.push({ state: d.state ? JSON.parse(d.state) : {}, summary: d.summary, updatedAt: d.clientUpdatedAt || 0 });
          });
          if (!people.length) return msg('아직 클라우드 기록이 없어요. 아인이 앱에서 구글 로그인이 되어 있는지 확인해 주세요.');
          // 기록이 여러 개면(예전 계정 등) 최근에 저장한 것부터 고르기
          people.sort((a, b) => b.updatedAt - a.updatedAt);
          const when = t => t ? `${new Date(t).getMonth() + 1}/${new Date(t).getDate()} 저장` : '저장 날짜 없음';
          $('who').innerHTML = people.length > 1
            ? `<select id="pick">${people.map((p, i) => `<option value="${i}">기록 ${i + 1} · ${when(p.updatedAt)} · 클리어 ${p.summary ? p.summary.cleared : '?'}개</option>`).join('')}</select>`
            : '';
          if ($('pick')) $('pick').onchange = e => { cur = Number(e.target.value); render(); };
          $('main').hidden = false;
          msg('');
          render();
        } catch (e) {
          msg(e.code === 'permission-denied' ? '읽을 수 없어요. 아빠 계정인지, Firebase 규칙을 바꿔서 게시했는지 확인해 주세요.' : '불러오지 못했어요: ' + e.message);
        }
      });
    }
  </script>
</body>
</html>
